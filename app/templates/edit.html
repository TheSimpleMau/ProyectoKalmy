<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Libro - Librería Kalmy</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
    <main class="container">
        <article>
            <header>
                <strong>✏️ Editar Libro: {{ item.name }}</strong>
            </header>
            
            <form action="/edit/{{ item.id }}" method="post">
                <div class="grid">
                    <label>
                        Título
                        <input type="text" name="name" value="{{ item.name }}" required>
                    </label>
                    <label>
                        Autor
                        <input type="text" name="author" value="{{ item.author }}" required>
                    </label>
                </div>
                
                <div class="grid">
                    <label>
                        Precio ($)
                        <input type="number" step="0.01" name="price" value="{{ item.price }}" required>
                    </label>
                    <label>
                        Inventario (Stock)
                        <input type="number" name="stock" value="{{ item.stock }}" required min="0">
                    </label>
                </div>

                <label>
                    Descripción
                    <textarea name="description" required>{{ item.description }}</textarea>
                </label>
                
                <footer>
                    <div class="grid">
                        <a href="/" role="button" class="secondary outline">Cancelar</a>
                        <button type="submit">💾 Guardar Cambios</button>
                    </div>
                </footer>
            </form>
        </article>
    </main>
</body>
</html>
